<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sitio web de reservas de mesas para un restaurante cinco (5) estrellas en Quindío, Colombia">

    <link rel="stylesheet" href="/template/template.css"> <!--CSS Temlplate-->

<body class="">

            <ol class="flex justify-around">

                <li class=""><div><a href="/"><p>F&Q</p></a></div></li>

            <form action="">

                        <li><button class="tables"></button></li> <!--Table 2-->
                        <li><button class="tables"></button></li> <!--Table 3-->
                    </ul>
                </div>
                <div class="sect-2"><!--3ra a 6ta Mesa-->

                        <li><button class="tables"></button></li> <!--Table 4-->
                        <li><button class="tables"></button></li> <!--Table 5-->
                        <li><button class="tables"></button></li> <!--Table 6-->
                    </ul>
                </div>
                <div class="sect-3"><!--7ma a 10ma Mesa-->
                    <ul class="flex justify-between">
                        <li><button class="tables"></button></li> <!--Table 7-->
                        <li><button class="tables"></button></li> <!--Table 8-->
                        <li><button class="tables"></button></li> <!--Table 9-->
                    </ul>
                </div>
            </form>

    </section>
    <footer class="mt-6">
        <ul class="flex justify-around">
          <li class=""><img src="/site_web/multimedia/index/banner.jpeg" alt="Logo"></li>
          <li>
