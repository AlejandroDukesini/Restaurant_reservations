name: CI

on:
  push:
    branches: [Principal, Beta, main]
  pull_request:
  workflow_dispatch:

# Solo lectura del repositorio: el pipeline no publica ni despliega nada.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java + Spring Boot)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PostgreSQL real para PostgresSchemaIntegrationTest: aplica las migraciones de Flyway
    # sobre una base vacia y comprueba que Hibernate valida el esquema resultante.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: reservas_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/reservas_test
      TEST_POSTGRES_USER: postgres
      TEST_POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Cachea el wrapper y las dependencias; la version de Gradle la fija gradle-wrapper.properties.
      - uses: gradle/actions/setup-gradle@v5

      - name: Compilar, probar y medir cobertura
        run: ./gradlew build --no-daemon --console=plain

      - name: Publicar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test
          if-no-files-found: ignore

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site_web
    steps:
      - uses: actions/checkout@v5

      # Sin "version": la toma del campo packageManager de site_web/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site_web/package.json

      - uses: actions/setup-node@v5
        with:
          # jsdom 30 (entorno de Vitest) exige Node >= 22.22.2 o >= 24.15.
          node-version: "24"
          cache: pnpm
          cache-dependency-path: site_web/pnpm-lock.yaml

      - name: Instalar dependencias (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: Pruebas con cobertura
        run: pnpm test:coverage

      - name: Build de produccion
        run: pnpm build

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-coverage
          path: site_web/coverage
          if-no-files-found: ignore

  android:
    name: Android (Kotlin + Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      # AGP 8.6 requiere JDK 17+; ubuntu-latest ya trae el Android SDK (ANDROID_HOME).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Compilar la variante debug y ejecutar las pruebas unitarias
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon --console=plain

      - name: Publicar APK debug y reportes
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/tests
          if-no-files-found: ignore

  docker:
    name: Imagen Docker (solo build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      # Valida que el Dockerfile de despliegue (Railway) sigue construyendo. No se publica la imagen.
      - name: Construir imagen
        run: docker build --tag restaurant-reservations:ci .
