spring:
  application:
    name: restaurant-reservations
  datasource:
    url: jdbc:postgresql://localhost:5432/restaurant_reservations
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

jwt:
  secret: your-secret-key-for-jwt-token-generation-minimum-256-bits
  expiration: 86400000

app:
  website-template-path: ./website-templates
  generated-websites-path: ./generated-websites
