spring:
  application:
    name: restaurant-reservations
  datasource:
    url: jdbc:postgresql://localhost:5432/restaurant_reservations
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  # 8081 para evitar el choque con Apache/XAMPP (que suele usar el 8080).
  port: 8081

jwt:
  # HS512 requiere una clave de al menos 512 bits (>= 64 bytes).
  secret: maison-noir-jwt-signing-secret-key-hs512-minimum-512-bits-must-be-64plus-bytes-2026
  expiration: 86400000

app:
  website-template-path: ./website-templates
  generated-websites-path: ./generated-websites
