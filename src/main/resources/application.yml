spring:
  application:
    name: restaurant-reservations
  datasource:
    # En Railway se inyecta SPRING_DATASOURCE_URL; en local se usa el valor por defecto.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/restaurant_reservations}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      # En produccion debe fijarse JPA_DDL_AUTO=validate y migrar el esquema con
      # una herramienta versionada (Flyway/Liquibase): 'update' deja que la app
      # altere el esquema en caliente, lo que amplifica cualquier RCE o error.
      ddl-auto: ${JPA_DDL_AUTO:update}
    # El SQL en consola filtra estructura y datos a los logs: apagado por defecto.
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  # Railway inyecta PORT y espera que el contenedor escuche ahi.
  # En local se mantiene 8081 para evitar el choque con Apache/XAMPP.
  port: ${PORT:8081}
  error:
    # No exponer stacktrace ni mensaje interno en las paginas de error de Spring.
    include-stacktrace: never
    include-message: never
    include-exception: false
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: strict
  tomcat:
    # Techo al tamano de peticion: limita el abuso de memoria por cuerpos gigantes.
    max-http-form-post-size: 256KB

jwt:
  # HS512 requiere una clave de al menos 512 bits (>= 64 bytes).
  # Sin valor por defecto a proposito: un secreto en el repositorio permite a
  # cualquiera que lea el codigo firmar tokens validos de administrador.
  # Si no se define, JwtTokenProvider genera una clave efimera y avisa por log.
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  website-template-path: ./website-templates
  generated-websites-path: ./generated-websites
  # Credenciales de las cuentas de demostracion sembradas en una base vacia.
  # En un despliegue real debe definirse SEED_PASSWORD con un valor unico,
  # o desactivarse la siembra con SEED_ENABLED=false.
  seed:
    enabled: ${SEED_ENABLED:true}
    password: ${SEED_PASSWORD:password123}
  # Limite de peticiones por IP para los endpoints sensibles (login y reserva publica).
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-attempts-per-minute: ${RATE_LIMIT_LOGIN:10}
    public-writes-per-minute: ${RATE_LIMIT_PUBLIC:20}

logging:
  level:
    # Trazas de autenticacion/autorizacion para el SOC sin activar debug global.
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
